#cloud-config
package_update: true
package_upgrade: true
timezone: America/Phoenix

users:
  - default
  - name: kauffpc
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-rsa  pk@inf-55135

ssh_pwauth: false

packages:
  - qemu-guest-agent
  - btop
  - git
  - curl
  - wget
  - tmux
  - bash-completion
  - rsync
  - unzip
  - tar

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  - sudo bash -c "curl -sSL https://raw.githubusercontent.com/infinatious/infnet-incus-scripts/refs/heads/main/post-install.sh | bash"